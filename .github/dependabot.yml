version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    # Backend majors are deliberate too — track in-range updates only, batch majors by hand.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    groups:
      js-minor-patch:
        update-types: [minor, patch]
    # Frontend majors are batched by hand in an agreed order (biome 2, zod 4, …);
    # Dependabot only tracks in-range updates for them.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Action majors are deliberate, not weekly bumps — batch them by hand.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Base-image majors (a new Python or Node line) are deliberate decisions, not weekly bumps.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
