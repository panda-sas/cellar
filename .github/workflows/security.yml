name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC — weekly rescan against the fresh CVE feed
  workflow_dispatch:

permissions:
  contents: read

# Same gate as `make security-scan` (the release gate), run early and often.
# Accepted findings live in .trivyignore with a reason, nowhere else.
jobs:
  trivy-fs:
    name: Trivy — lockfiles & secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-dirs: node_modules,.venv,.next,.claude,snapshots,backend/data,.logs
          trivyignores: .trivyignore

  trivy-images:
    name: Trivy — backend & frontend images
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: cellar # images build as cellar-backend / cellar-frontend
    steps:
      - uses: actions/checkout@v6
      - run: docker compose -f docker-compose.infra.yml -f docker-compose.yml build backend frontend
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: cellar-backend
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: cellar-frontend
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

  gitleaks:
    name: Gitleaks — incoming commits
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      # The commits this event adds; everything older is already on main.
      RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # both ends of the range must be present
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      # Same config the pre-commit hook loads; accepted findings live in .gitleaks.toml with a reason.
      - run: |
          case "$RANGE" in 0000000000000000000000000000000000000000..*) RANGE="${GITHUB_SHA}~1..${GITHUB_SHA}" ;; esac # first push to a branch
          ./gitleaks git --no-banner --redact --config .gitleaks.toml --log-opts "$RANGE" .
