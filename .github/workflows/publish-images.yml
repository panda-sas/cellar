name: Publish Images

# Tag-driven: the git tag is the single source of truth for a release (see RELEASING.md).
# A plain push to main builds nothing — CI's docker-build already proves the images compile.
on:
  push:
    tags:
      - 'backend-v*.*.*'
      - 'frontend-v*.*.*'

jobs:
  changes:
    name: Detect component
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.decide.outputs.backend }}
      frontend: ${{ steps.decide.outputs.frontend }}
    steps:
      - id: decide
        # The tag namespace picks the component (backend-v* / frontend-v*).
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$REF_NAME" in
            backend-v*)  echo "backend=true"  >> "$GITHUB_OUTPUT"; echo "frontend=false" >> "$GITHUB_OUTPUT" ;;
            frontend-v*) echo "backend=false" >> "$GITHUB_OUTPUT"; echo "frontend=true"  >> "$GITHUB_OUTPUT" ;;
            *)           echo "backend=false" >> "$GITHUB_OUTPUT"; echo "frontend=false" >> "$GITHUB_OUTPUT" ;;
          esac

  backend:
    name: Build & push backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history + tags so build-info.sh can derive the version
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: ver
        # Single source of build identity (also what `make dev` exports).
        run: scripts/build-info.sh backend | awk -F= -v OFS== '{$1=tolower($1)}1' >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/sidxz/cellar-backend
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=match,pattern=\d+\.\d+\.\d+,group=0
            type=match,pattern=\d+\.\d+,group=0
            type=match,pattern=\d+,group=0
      - name: Build image (load for scan)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            APP_GIT_SHA=${{ steps.ver.outputs.git_sha }}
            APP_BUILD_DATE=${{ steps.ver.outputs.build_date }}
          tags: cellar-backend:scan
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Scan image (release gate — same as make security-scan)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: cellar-backend:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            APP_GIT_SHA=${{ steps.ver.outputs.git_sha }}
            APP_BUILD_DATE=${{ steps.ver.outputs.build_date }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  frontend:
    name: Build & push frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: ver
        # Single source of build identity (also what `make dev` exports).
        run: scripts/build-info.sh frontend | awk -F= -v OFS== '{$1=tolower($1)}1' >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/sidxz/cellar-frontend
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=match,pattern=\d+\.\d+\.\d+,group=0
            type=match,pattern=\d+\.\d+,group=0
            type=match,pattern=\d+,group=0
      - name: Build image (load for scan)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            APP_GIT_SHA=${{ steps.ver.outputs.git_sha }}
            APP_BUILD_DATE=${{ steps.ver.outputs.build_date }}
          tags: cellar-frontend:scan
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Scan image (release gate — same as make security-scan)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: cellar-frontend:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            APP_GIT_SHA=${{ steps.ver.outputs.git_sha }}
            APP_BUILD_DATE=${{ steps.ver.outputs.build_date }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  release:
    name: Publish GitHub Release
    needs: [backend, frontend]
    if: ${{ always() && github.ref_type == 'tag' && (needs.backend.result == 'success' || needs.frontend.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: range
        run: |
          NS="${GITHUB_REF_NAME%%-v*}"                       # backend | frontend
          # Previous same-namespace tag by creation date (assumes tags are created in version order).
          PREV="$(git tag --list "${NS}-v*" --sort=-creatordate | sed -n '2p')"
          if [ -n "$PREV" ]; then
            echo "range=${PREV}..${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "range=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
          echo "path=${NS}/**" >> "$GITHUB_OUTPUT"
          # Title-case the namespace: "backend" -> "Backend".
          TITLE="$(printf '%s' "$NS" | sed 's/^./\U&/') ${GITHUB_REF_NAME#${NS}-}"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
      - uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        id: cliff
        with:
          config: cliff.toml
          args: --include-path "${{ steps.range.outputs.path }}" ${{ steps.range.outputs.range }}
        env:
          OUTPUT: CHANGES.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.range.outputs.title }}
          body_path: ${{ steps.cliff.outputs.changelog }}
